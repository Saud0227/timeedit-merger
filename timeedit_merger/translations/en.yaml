---
configuration:
    admin_token:
      name: Admin Token
      description: >-
        Admin token for the API, must be 43 characters long and url safe
    feed_tokens:
      name: Feed Tokens
      description: >-
        Feed tokens for the API, must be 43 characters long and url safe. Can be a single token or a comma separated list of tokens.
    external_url:
        name: External URL
        description: >-
            External URL where the feeds are accessible. Note that the feeds are accessible at /feed/<salt>.ics, so the external URL should not include /feed/<salt>.ics.
            The external URL is optional, but links will not work correctly if it is not set.