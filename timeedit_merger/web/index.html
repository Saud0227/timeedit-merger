<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Timeedit Merger</title>
    <link rel="stylesheet" href="static/styles.css"/>
<!--    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/base.min.css"/>-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=autorenew,check,close,delete,edit_square,save_as,settings,warning" />
</head>
<body>
<main>
    <header>
        <h1>Timeedit Merger</h1>
    </header>
    <div id="main-content"></div>
    <aside>
        <button id="new-source-button" aria-expanded="false" aria-controls="popup-container">New source</button>
        <button id="reset-button">Reset</button>
        <button id="refresh-cache-button">Reload cache</button>
    </aside>
</main>

</body>
<div id="popup-container" class="popup-container" role="dialog" aria-modal="true" hidden>
    <div class="popup">
        <h3>New Source</h3>
        <form id="new-source-form">
            <label for="source-name">Name:</label>
            <input type="text" id="source-name" name="name" required autocomplete="off"/>
            <label for="source-url">URL:</label>
            <input type="url" id="source-url" name="url" required autocomplete="off"/>
            <button id="new-source-submit" type="submit" disabled>Create</button>
        </form>
        <button id="new-source-cancel">
            <span class="material-symbols-rounded">close</span>
        </button>
    </div>
</div>
<script src="static/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
</html>
