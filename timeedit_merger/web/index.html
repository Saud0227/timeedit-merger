<!doctype html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Timeedit Merger</title>
    <link rel="stylesheet" href="static/styles.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/base.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css"/>
</head>
<body>
<main>
    <h1>Timeedit Merger</h1>
    <div id="main-content">
        <div id="header-row" class="source-row">
            <h2>Name</h2>
            <h2>URL</h2>
            <a id="output1a" class="feed-item">
                <label id="output1label">...</label>
            </a>
            <a id="output2a" class="feed-item">
                <label id="output2label">...</label>
            </a>
            <h2>Del?</h2>
        </div>
    </div>
    <aside>
        <button id="new-source-button">New source</button>
        <button id="reset-button">Reset</button>
        <button id="refresh-cache-button">Reload cache</button>
        <button heavy id="save">Save</button>
    </aside>
</main>
<label for="choices-multiple-remove-button">With remove button</label>
<select class="form-control" name="choices-multiple-remove-button" id="choices-multiple-remove-button" placeholder="This is a placeholder" multiple>
    <option value="Choice 1" selected>Choice 1</option>
    <option value="Choice 2">Choice 2</option>
    <option value="Choice 3">Choice 3</option>
    <option value="Choice 4">Choice 4</option>
</select>
</body>
<script src="static/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
</html>
